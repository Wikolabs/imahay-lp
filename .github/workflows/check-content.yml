name: Verifier les liens culture

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "src/data/culture.json"
      - "scripts/check-videos.mjs"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verifier que chaque video est toujours en ligne
        run: node scripts/check-videos.mjs
